[platformio]
; Nutzt den aktuellen Ordner direkt als Quellcode-Ordner (für das flache MVP)
src_dir = .

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; Kompiliert nur test_sketch.cpp und ignoriert den Unterordner scenarios/
build_src_filter = +<test_sketch.cpp> -<scenarios/>

; Aktiviert USB-Serial über den direkten USB-C-Port des ESP32-C3 (GPIO 18/19)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Führt pio_hook.py automatisch VOR jedem Build-Vorgang aus
extra_scripts = pre:pio_hook.py
